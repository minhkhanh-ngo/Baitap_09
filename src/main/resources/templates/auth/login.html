<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
</head>
<body style="background: #f5f7fb; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <div style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px;">
        <h2 style="text-align: center; color: #1d4ed8;">Đăng nhập IOTSTAR SHOP</h2>
        
        <div th:if="${param.error}" style="color: red; font-size: 14px; margin-bottom: 10px; text-align: center;">Username/email hoặc password không đúng</div>
        <div th:if="${param.logout}" style="color: green; font-size: 14px; margin-bottom: 10px; text-align: center;">Bạn đã đăng xuất thành công</div>
        
        <form th:action="@{/login}" method="post">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Username hoặc Email</label>
                <input type="text" name="login" placeholder="Nhập username hoặc email" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
            </div>
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Password</label>
                <input type="password" name="password" placeholder="Nhập password" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
            </div>
            
            <button type="submit" style="width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Đăng nhập</button>
        </form>
    </div>
</body>
</html>
