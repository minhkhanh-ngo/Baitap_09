<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | UTEShop</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h1>IOTSTAR SHOP</h1>
        <h2>Đăng nhập</h2>

        <div class="alert error" th:if="${param.error}">Username/email hoặc mật khẩu không đúng.</div>
        <div class="alert success" th:if="${param.logout}">Bạn đã đăng xuất thành công.</div>

        <form th:action="@{/login}" method="post">
            <label>Username hoặc Email</label>
            <input type="text" name="login" placeholder="Nhập username hoặc email" required autofocus>

            <label>Mật khẩu</label>
            <input type="password" name="password" placeholder="Nhập mật khẩu" required>

            <button class="btn primary full" type="submit" style="margin-top: 15px;">Đăng nhập</button>
        </form>

        <p style="display: flex; justify-content: space-between; margin-top: 15px;">
            <a th:href="@{/register}">Tạo tài khoản</a>
            <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
        </p>
    </div>
</body>
</html>
