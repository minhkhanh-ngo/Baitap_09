<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
    <header th:fragment="header" style="background: #172554; color: white; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center;">
        <nav>
            <a th:href="@{/}" style="color: white; text-decoration: none; font-size: 20px; font-weight: bold;">UTEShop</a>
        </nav>
        
        <div th:if="${#authorization.expression('isAuthenticated()')}" style="display: flex; align-items: center; gap: 15px;">
            <img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/user.png'}" 
                 alt="Avatar" width="40" height="40" style="border-radius: 50%; object-fit: cover; border: 2px solid white;">
            
            <span th:text="${#authentication.principal.fullName}" style="font-weight: bold;">Nguyễn Văn A</span>
            
             <span th:text="'(' + ${#authentication.principal.username} + ')'" style="color: #cbd5e1; font-size: 14px;">(username)</span>
            
               <span th:text="${#authentication.principal.role}" style="background: #2563eb; padding: 3px 8px; border-radius: 4px; font-size: 12px;">ROLE_USER</span>
            
            <form th:action="@{/logout}" method="post" style="display: inline; margin-left: 10px;">
                <button type="submit" style="background: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Đăng xuất</button>
            </form>
        </div>
        
        <div th:unless="${#authorization.expression('isAuthenticated()')}">
            <a th:href="@{/login}" style="color: white; background: #2563eb; padding: 8px 15px; border-radius: 5px; text-decoration: none;">Đăng nhập</a>
        </div>
    </header>
</body>
</html>
